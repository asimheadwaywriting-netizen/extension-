<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Profile Link Extractor</title>
    <style>
      :root {
        color-scheme: light;
        --border: #d9dce1;
        --muted: #5b6470;
        --accent: #0a66c2;
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #1b1f23;
        background: #fff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      button {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #f4f5f7;
        color: #1b1f23;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #eaecef; }
      button:disabled { opacity: 0.5; cursor: default; }
      #extract {
        width: 100%;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 9px 10px;
      }
      #extract:hover:not(:disabled) { background: #08519b; }
      #status {
        margin: 8px 0;
        min-height: 16px;
        color: var(--muted);
      }
      #status.error { color: #b42318; }
      #results {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #results:empty { display: none; }
      #results li {
        padding: 7px 9px;
        border-bottom: 1px solid #eef0f2;
      }
      #results li:last-child { border-bottom: 0; }
      .name { font-weight: 600; display: block; }
      .name.missing { font-weight: 400; color: var(--muted); font-style: italic; }
      .url {
        display: block;
        color: var(--muted);
        word-break: break-all;
        font-size: 12px;
      }
      .actions { display: flex; gap: 8px; }
      .actions button { flex: 1; }
      footer {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Profile Link Extractor</h1>

    <button id="extract" type="button">Extract profiles from this page</button>

    <p id="status" role="status" aria-live="polite"></p>

    <ul id="results"></ul>

    <div class="actions">
      <button id="copy" type="button" disabled>Copy for spreadsheet</button>
      <button id="download" type="button" disabled>Download CSV</button>
    </div>

    <footer>
      Reads only what is already rendered in the open tab. No requests, no
      scrolling, no stored data.
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
